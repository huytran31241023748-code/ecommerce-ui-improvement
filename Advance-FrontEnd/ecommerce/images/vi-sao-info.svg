<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120"><rect width="800" height="1120" fill="#f8f5ef"/><rect x="35" y="35" width="730" height="1050" rx="8" fill="none" stroke="#294369" stroke-width="3"/><rect x="35" y="35" width="730" height="160" fill="#294369"/><g font-family="Arial, sans-serif"><text x="90" y="110" font-size="27" fill="white">GÓC SÁCH</text><text x="90" y="155" font-size="20" fill="white">BỘ SƯU TẬP THỰC HÀNH</text><text x="90" y="290" font-size="28" fill="#294369">THÔNG TIN SÁCH</text><text x="90" y="390" font-size="36" fill="#24332e">Hải Đăng</text><text x="90" y="470" font-size="36" fill="#24332e">Khám phá</text><text x="90" y="550" font-size="36" fill="#24332e">Bộ sưu tập Góc sách</text><path d="M90 730 H710" stroke="#294369" stroke-width="2"/><text x="90" y="810" font-size="23" fill="#59645d">Tài nguyên minh họa do dự án tạo.</text><text x="90" y="850" font-size="23" fill="#59645d">Nội dung sách là dữ liệu mẫu.</text><text x="90" y="1000" font-size="23" fill="#294369">MỖI CUỐN SÁCH, MỘT GÓC NHÌN MỚI.</text></g></svg>